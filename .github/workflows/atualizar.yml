name: Atualizar produtos (de hora em hora)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m scraper.main
      - name: Salvar dados
        run: |
          git config user.name  "atualizador"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/products.json
          git diff --cached --quiet || git commit -m "dados: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git push
